distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# `-bin` rather than `-all`: the `-all` bundle ships sources and docs that an
# Android build never reads, and roughly doubles a download that is easy to
# fail on a slow connection.
#
# Sourced from a mirror because services.gradle.org is unreachable from this
# network — the connection times out before any bytes arrive. Swap back to
# https://services.gradle.org/distributions/... anywhere it resolves. Only the
# distribution host is affected; Google's Maven repo and Maven Central are both
# reachable and are still used for dependencies.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
networkTimeout=180000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
